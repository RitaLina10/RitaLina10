# PB Tecnologia - PB Gas Control — testes + instaladores Windows (.exe) e Android (.apk)
# Artefatos: aba "Actions" > execução > "Artifacts". Em tags v*, também publica uma Release.
name: Instaladores

on:
  push:
    branches: ["**"]
    paths: ["gascontrol/**", ".github/workflows/installers.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gascontrol

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gascontrol/requirements*.txt
      - run: pip install -r requirements-dev.txt bandit==1.9.4 pip-audit
      - run: python -m pytest -q
      - name: Análise estática (bandit)
        run: bandit -q -r app -s B104
      - name: CVEs nas dependências (pip-audit)
        run: pip-audit -r requirements.txt

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gascontrol/requirements*.txt
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/windows/make_version_info.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Empacotar servidor (PyInstaller)
        run: pyinstaller --noconfirm packaging/windows/pbgas-server.spec
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Teste do instalador (instala, verifica /ready e login, desinstala)
        timeout-minutes: 12
        shell: pwsh
        run: |
          function Show-Diag {
            Write-Output "===== setup.log ====="; if (Test-Path setup.log) { Get-Content setup.log -Tail 80 }
            Write-Output "===== install-service transcript ====="
            Get-ChildItem $env:TEMP, "$env:SystemRoot\Temp" -Filter 'pbgas-install-service.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            Write-Output "===== pbgas.log ====="; $l = "$env:ProgramData\PB Gas Control\logs\pbgas.log"; if (Test-Path $l) { Get-Content $l -Tail 40 }
            Write-Output "===== processos ====="; Get-Process | Where-Object { $_.Name -match 'setup|PBGas|pbgas|powershell|pwsh|icacls|schtasks|notepad' } | Format-Table Id, Name, StartTime -AutoSize | Out-String | Write-Output
            Write-Output "===== tarefa ====="; Get-ScheduledTask -TaskName 'PB Gas Control' -ErrorAction SilentlyContinue | Get-ScheduledTaskInfo | Format-List | Out-String | Write-Output
          }
          $setup = Get-ChildItem dist\installer\PBGasControl-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=firewall','/ADMINEMAIL=admin@pbgascontrol.com.br','/LOG=setup.log' -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Output "TIMEOUT do instalador"; Show-Diag; exit 1 }
          if ($p.ExitCode -ne 0) { Show-Diag; exit 1 }
          try {
            $r = Invoke-RestMethod http://127.0.0.1:8000/ready -TimeoutSec 10
            if ($r.status -ne 'ready') { throw "servidor não ficou pronto" }
            $first = Get-Content "$env:ProgramData\PB Gas Control\PRIMEIRO-ACESSO.txt" -Raw
            $pwd = [regex]::Match($first, 'Senha inicial:\s+(\S+)').Groups[1].Value
            $body = @{ email = 'admin@pbgascontrol.com.br'; password = $pwd } | ConvertTo-Json
            $tok = Invoke-RestMethod http://127.0.0.1:8000/api/auth/login -Method Post -Body $body -ContentType 'application/json'
            if (-not $tok.access_token) { throw "login falhou" }
            $task = Get-ScheduledTask -TaskName 'PB Gas Control'
            if ($task.Principal.UserId -ne 'SYSTEM') { throw "tarefa sem conta SYSTEM" }
            $acl = (Get-Acl "$env:ProgramData\PB Gas Control").Access | ForEach-Object { $_.IdentityReference.Value }
            if ($acl -match 'Users|Usuários|Everyone|Todos') { throw "pasta de dados acessível a usuários comuns: $acl" }
          } catch { Write-Output $_; Show-Diag; exit 1 }
          $un = Get-ChildItem "${env:ProgramFiles}\PB Tecnologia\PB Gas Control\unins*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(180000) -or $u.ExitCode -ne 0) { Write-Output "desinstalação falhou"; Show-Diag; exit 1 }
          if (Get-ScheduledTask -TaskName 'PB Gas Control' -ErrorAction SilentlyContinue) { throw "tarefa não removida" }
          if (-not (Test-Path "$env:ProgramData\PB Gas Control\pbgas.db")) { throw "dados não foram preservados na desinstalação" }
          Write-Output "Instalador OK"
      - uses: actions/upload-artifact@v4
        with:
          name: PBGasControl-Windows-${{ steps.ver.outputs.version }}
          path: gascontrol/dist/installer/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.PBGAS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Keystore de release (se configurado nos segredos)
        id: sign
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pbgas.jks"
            echo "PBGAS_KEYSTORE_FILE=$RUNNER_TEMP/pbgas.jks" >> "$GITHUB_ENV"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem PBGAS_KEYSTORE_BASE64: gerando APK de teste (debug). Veja README > Android."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar APK
        working-directory: gascontrol/android
        env:
          PBGAS_KEYSTORE_PASSWORD: ${{ secrets.PBGAS_KEYSTORE_PASSWORD }}
          PBGAS_KEY_ALIAS: ${{ secrets.PBGAS_KEY_ALIAS }}
          PBGAS_KEY_PASSWORD: ${{ secrets.PBGAS_KEY_PASSWORD }}
        run: gradle --no-daemon ${{ steps.sign.outputs.task }}
      - name: Renomear APK
        id: apk
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('app/__init__.py').read()).group(1))")
          src=$(ls android/app/build/outputs/apk/${{ steps.sign.outputs.dir }}/*.apk | head -1)
          suffix=$([ "${{ steps.sign.outputs.dir }}" = "release" ] && echo "" || echo "-teste")
          mkdir -p dist/android && cp "$src" "dist/android/PBGasControl-$v$suffix.apk"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/pbgas.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: PBGasControl-Android-${{ steps.apk.outputs.version }}
          path: gascontrol/dist/android/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
